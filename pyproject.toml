[project]
name = "llamajev"
version = "0.1.0"
description = "TypeSafe Jev-compatible /v1/systemone server in front of an unmodified llama-server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "orjson>=3.10",
    "pillow>=11",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn>=0.30",
]

[project.scripts]
llamajev = "llamajev.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pyarrow>=17",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llamajev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: needs a running llama-server (set LLAMAJEV_LIVE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"
